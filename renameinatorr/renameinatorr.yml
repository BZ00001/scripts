# renameinatorr.yml
# ─────────────────────────────────────────────────────────────────────────────
# Global settings
# ─────────────────────────────────────────────────────────────────────────────

# Set to true to log what would be renamed without making any changes.
# Folder renames that would occur are also shown in dry-run mode.
dry_run: false

# Log verbosity: DEBUG | INFO | WARNING | ERROR
log_level: INFO

# Optional log file with rotation (5 MB per file, 3 backups kept).
# Useful for infrequent schedules where the terminal log is long gone by
# the time you check. Leave commented out to log to stdout only.
# log_file: /mnt/user/appdata/scripts/natorr/renameinatorr.log

# Discord webhook URL for rename notifications (optional).
# A notification is sent after every run, including a summary when nothing
# needed renaming and error fields for any instances that failed.
# Leave commented out or empty to disable.
# discord_webhook: https://discord.com/api/webhooks/YOUR_WEBHOOK_URL

# ─────────────────────────────────────────────────────────────────────────────
# Instances
# Define one entry per Radarr / Sonarr instance you want to manage.
# ─────────────────────────────────────────────────────────────────────────────
instances:

  - name: Radarr
    type: radarr                          # radarr | sonarr
    url: http://192.168.1.200:7878
    api_key: YOUR_API_KEY

    # Number of items to process per run (one chunk per scheduled run).
    # Keep this at 50-75 for most setups — smaller chunks keep API timeouts
    # proportional and avoid hammering Sonarr/Radarr with too many requests
    # at once. When enable_batching: true is set, this value is the chunk
    # size used across the full library run and must be set to a reasonable
    # value (50-75 recommended). Do not set to 0 — processing an entire
    # large library in one chunk will cause very long run times and
    # unpredictable API timeouts.
    count: 5

    # Tag applied to every item after it has been processed. Items with this
    # tag are skipped on subsequent runs. Once all items are tagged the tag is
    # cleared and the cycle starts over, catching any renames that have become
    # necessary since the last full pass.
    tag_name: renamed

    # Items with this tag are always skipped, even after a cycle reset.
    # Useful for items you never want auto-renamed. (optional)
    ignore_tag: rename-ignore

    # Rename the containing folder to match the naming format configured in
    # Radarr / Sonarr. The format is read live from the app on every run,
    # so changes to the format in the app are picked up automatically.
    # Note: in dry-run mode only the number of items submitted is shown —
    # the app itself determines which folders actually need renaming, so
    # a per-item preview is not available.
    rename_folders: true

    # When false (default): processes one chunk of `count` items per run,
    # advancing through the library gradually across scheduled runs.
    # Best for regular schedules (e.g. daily) where you want to spread work
    # over time without long run times.
    # When true: processes the entire library in one run, using `count` as the
    # chunk size. Best for an initial bulk pass or infrequent scheduled runs.
    # Always keep `count` at 50-75 in this mode — never set count to 0 when
    # batching is enabled.
    enable_batching: false

    # When true, forces a metadata refresh from TVDB/TMDB for each item before
    # checking the rename list. This ensures title updates are reflected
    # immediately rather than waiting for Sonarr/Radarr's own refresh schedule.
    # Slows each run down as the refresh must complete before renaming starts.
    # refresh_before_rename: false

    # Restrict processing to items whose title contains this string
    # (case-insensitive substring match). Useful for testing a single item
    # before running against the full library. Comment out or leave empty
    # to process all items.
    # title_filter: "Some Movie"

  - name: Sonarr
    type: sonarr
    url: http://192.168.1.200:8989
    api_key: YOUR_API_KEY
    count: 15
    tag_name: renamed
    ignore_tag: rename-ignore
    rename_folders: true
    enable_batching: false
    # refresh_before_rename: false
    # title_filter: "Some Show"

  # Example: second Radarr instance (4K library)
  # - name: Radarr4K
  #   type: radarr
  #   url: http://192.168.1.200:7879
  #   api_key: YOUR_API_KEY
  #   count: 5
  #   tag_name: renamed
  #   ignore_tag: rename-ignore
  #   rename_folders: true
  #   enable_batching: false
  #   # refresh_before_rename: false
  #   # title_filter: "Some Movie"
